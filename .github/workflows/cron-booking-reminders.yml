name: cron-booking-reminders

# Daily reminder emails (Restzahlung + Anreise-Instruktionen).
# Runs the Node script directly — no Supabase edge function involved.
on:
  schedule:
    - cron: "15 7 * * *" # 07:15 UTC (~09:15 Berlin summer / 08:15 winter)
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run booking-reminders
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO_ADMIN: ${{ secrets.EMAIL_TO_ADMIN }}
          KEYBOX_CODE: ${{ secrets.KEYBOX_CODE }}
        run: node scripts/cron/booking-reminders.mjs
