name: cron-airbnb-sync

# Hourly Airbnb iCal → Supabase bookings reconcile.
# Runs the Node script in scripts/cron/airbnb-sync.mjs directly — no
# Supabase edge function involved. Same logic, one place to debug.
on:
  schedule:
    - cron: "5 * * * *" # 5 min past the hour, hourly
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run airbnb-sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/cron/airbnb-sync.mjs
